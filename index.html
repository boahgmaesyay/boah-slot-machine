<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slot Machine</title>

<style>
body{
  background:radial-gradient(circle at top,#222,#000);
  color:white;
  font-family:system-ui,Arial;
  text-align:center;
  margin:0;padding:10px
}
h1{
  color:gold;
  text-shadow:0 0 20px gold;
  animation:float 6s ease-in-out infinite
}
@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
  100%{transform:translateY(0)}
}
.panel{
  background:rgba(255,255,255,.06);
  border:2px solid rgba(255,215,0,.6);
  border-radius:20px;
  padding:15px;
  margin:15px auto;
  max-width:380px;
  box-shadow:0 0 20px rgba(255,215,0,.2)
}
.reels{
  font-size:48px;
  display:flex;
  justify-content:space-around;
  height:60px;
  overflow:hidden
}
.reel.spin{animation:spin .15s linear infinite}
@keyframes spin{
  0%{transform:translateY(0)}
  100%{transform:translateY(-50px)}
}
button{
  background:linear-gradient(135deg,gold,#ffb700);
  border:none;border-radius:999px;
  padding:10px 16px;
  font-size:15px;
  cursor:pointer;
  margin:4px
}
details{
  background:rgba(0,0,0,.4);
  border-radius:16px;
  padding:10px
}
summary{color:gold;font-weight:bold;cursor:pointer}
.item{
  display:inline-block;
  margin:4px;
  position:relative
}
.item:hover::after{
  content:attr(data-tip);
  position:absolute;
  bottom:120%;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  color:white;
  border:2px solid gold;
  border-radius:10px;
  padding:6px 8px;
  white-space:pre-line;
  font-size:12px;
  box-shadow:0 0 10px gold;
  z-index:10;
  width:max-content;
  max-width:220px
}
#popup{
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  display:none;align-items:center;justify-content:center
}
#popupBox{
  background:#111;
  border:3px solid gold;
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 30px gold
}
.small{
  font-size:12px;
  opacity:.7
}
</style>
</head>

<body>

<h1>🎰 SLOT MACHINE 🎰</h1>

<div class="panel">💰 Money: $<span id="money">0</span></div>

<div class="panel">
  <div class="reels">
    <span class="reel" id="r1">🍒</span>
    <span class="reel" id="r2">🍋</span>
    <span class="reel" id="r3">🍇</span>
  </div>
  <button onclick="spin()">SPIN</button>
</div>

<div class="panel">
<details>
<summary>🏪 Luxury Store</summary>
<div id="store"></div>
</details>
</div>

<div class="panel">
<details>
<summary>🏆 Achievements</summary>
<div id="achievements"></div>
</details>
</div>

<div class="panel">
<button onclick="resetSave()">🧹 Reset Save (Fix Bugs)</button>
<p class="small">Only resets this game’s progress</p>
</div>

<div id="popup">
  <div id="popupBox">
    <p id="popupText"></p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

<audio id="spinSound" src="https://actions.google.com/sounds/v1/foley/cloth_swipe.ogg"></audio>
<audio id="winSound" src="https://actions.google.com/sounds/v1/impacts/wood_plank_flicks.ogg"></audio>
<audio id="jackpotSound" src="https://actions.google.com/sounds/v1/impacts/heavy_metal_impact.ogg"></audio>

<script>
const symbols=["🍒","🍋","🍇","🔔","⭐","💎"];
let money=0,spins=0,jackpots=0;

const shopItems={
 lucky:{name:"🍀 Lucky Coin",price:100,desc:"More ⭐ symbols"},
 gem:{name:"💎 Royal Gem",price:200,desc:"More 💎 symbols"},
 watch:{name:"⌚ Diamond Watch",price:300,desc:"+10% money"},
 wallet:{name:"🪙 Golden Wallet",price:2000,desc:"+20% money"},
 crown:{name:"👑 Casino Crown",price:5000,desc:"+5% ALL money"}
};

let boosts={};
Object.keys(shopItems).forEach(k=>boosts[k]=false);

let achievements=[
 {name:"🎰 Gambler I",goal:25,reward:100,type:"spins"},
 {name:"🎰 Gambler II",goal:100,reward:400,type:"spins"},
 {name:"🎰 Gambler III",goal:500,reward:2000,type:"spins"},
 {name:"💰 High Roller I",goal:1000,reward:500,type:"money"},
 {name:"💰 High Roller II",goal:10000,reward:3000,type:"money"},
 {name:"💎 Diamond Hands I",goal:5,reward:500,type:"jackpots"},
 {name:"💎 Diamond Hands II",goal:25,reward:3000,type:"jackpots"}
].map(a=>({...a,done:false}));

const r1=document.getElementById("r1"),
r2=document.getElementById("r2"),
r3=document.getElementById("r3"),
moneyEl=document.getElementById("money"),
storeEl=document.getElementById("store"),
achEl=document.getElementById("achievements");

function popup(m){popupText.textContent=m;popup.style.display="flex"}
function closePopup(){popup.style.display="none"}

function resetSave(){
 localStorage.removeItem("slotSave");
 location.reload();
}

function save(){
 localStorage.setItem("slotSave",JSON.stringify({money,spins,jackpots,boosts,achievements}))
}
function load(){
 const d=JSON.parse(localStorage.getItem("slotSave"));
 if(!d)return;
 money=d.money||0;
 spins=d.spins||0;
 jackpots=d.jackpots||0;
 boosts=d.boosts||boosts;
 achievements=d.achievements||achievements;
}

function getSymbol(){
 let pool=[...symbols];
 if(boosts.lucky)pool.push("⭐");
 if(boosts.gem)pool.push("💎");
 return pool[Math.floor(Math.random()*pool.length)]
}

function spin(){
 spins++;
 spinSound.play();
 [r1,r2,r3].forEach(r=>r.classList.add("spin"));
 setTimeout(()=>{
  [r1,r2,r3].forEach(r=>r.classList.remove("spin"));
  r1.textContent=getSymbol();
  r2.textContent=getSymbol();
  r3.textContent=getSymbol();

  if(r1.textContent===r2.textContent&&r2.textContent===r3.textContent){
   let win=10;
   if(r1.textContent==="⭐")win=25;
   if(r1.textContent==="💎"){win=50;jackpots++;jackpotSound.play()}
   else winSound.play();

   if(boosts.watch)win*=1.1;
   if(boosts.wallet)win*=1.2;
   if(boosts.crown)win*=1.05;

   money+=Math.floor(win);
   popup("🎉 WIN +$"+Math.floor(win))
  }
  update();
 },700)
}

function buyItem(k){
 const i=shopItems[k];
 if(boosts[k])return popup("Already owned!");
 if(money<i.price)return popup("Not enough money!");
 money-=i.price;
 boosts[k]=true;
 popup("Purchased "+i.name+"!");
 update();
}

function update(){
 moneyEl.textContent=Math.floor(money);
 renderStore();
 achievements.forEach(a=>{
  const v=a.type==="spins"?spins:
           a.type==="money"?money:
           jackpots;
  if(!a.done&&v>=a.goal){
   a.done=true;
   money+=a.reward;
   popup("🏆 "+a.name+" +$"+a.reward)
  }
 });
 renderAchievements();
 save();
}

function renderStore(){
 storeEl.innerHTML="";
 for(const k in shopItems){
  const i=shopItems[k];
  storeEl.innerHTML+=`
   <span class="item" data-tip="${i.desc}">
    <button onclick="buyItem('${k}')">
     ${boosts[k]?"✅":"🛒"} ${i.name} ($${i.price})
    </button>
   </span><br>`;
 }
}

function renderAchievements(){
 achEl.innerHTML="";
 achievements.forEach(a=>{
  achEl.innerHTML+=`
   <div class="item" data-tip="Goal: ${a.goal}\nReward: $${a.reward}">
    ${a.done?"✅":"⬜"} ${a.name}
   </div>`;
 })
}

load();
update();
</script>

</body>
</html>
